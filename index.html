<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reforma Tributária IBS/CBS — ForçaNova</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg-card: #121b2e;
      --bg-elev: #182338;
      --line: #243049;
      --text: #e8eef8;
      --muted: #93a0b8;
      --accent: #3dd6c6;
      --accent-2: #7aa2ff;
      --warn: #f0b429;
      --high: #ff6b7a;
      --mid: #f0b429;
      --low: #5ee0a0;
      --ok: #5ee0a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
    aside {
      background: #080e1a;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .brand {
      padding: 22px 18px 16px;
      border-bottom: 1px solid var(--line);
    }
    .brand h1 {
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .brand p { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.4; }
    nav {
      overflow: auto;
      padding: 10px 8px 24px;
      flex: 1;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      cursor: pointer;
      line-height: 1.35;
    }
    nav button:hover { background: var(--bg-elev); color: var(--text); }
    nav button.active {
      background: #16343a;
      color: var(--accent);
      font-weight: 600;
    }
    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
      background: #0d1526;
    }
    .bar .meta { color: var(--muted); font-size: 13px; }
    .bar .controls { display: flex; gap: 8px; align-items: center; }
    .bar button, .bar .kbd {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .progress {
      height: 3px;
      background: var(--line);
    }
    .progress > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      width: 0%;
    }
    .stage {
      flex: 1;
      overflow: auto;
      padding: 28px 40px 48px;
    }
    .slide { display: none; max-width: 1100px; animation: in .25s ease; }
    .slide.on { display: block; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    h2 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
    .lede { color: var(--muted); font-size: 15px; margin-bottom: 22px; max-width: 820px; line-height: 1.5; }
    .grid { display: grid; gap: 14px; }
    .g2 { grid-template-columns: 1fr 1fr; }
    .g3 { grid-template-columns: 1fr 1fr 1fr; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
    }
    .card h3 { font-size: 14px; margin-bottom: 8px; color: var(--accent); }
    .card p, .card li { color: #c9d4e8; font-size: 14px; line-height: 1.55; }
    ul { padding-left: 18px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #0e182b; color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: .04em;
    }
    .alto { background: #3a1520; color: var(--high); }
    .medio { background: #3a2e10; color: var(--mid); }
    .baixo { background: #12301f; color: var(--low); }
    .fato { background: #132a3a; color: var(--accent-2); }
    .rec { background: #13332e; color: var(--accent); }
    .hip { background: #2d2410; color: var(--warn); }
    .hours {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .sum {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 8px 0 18px;
    }
    .kpi {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      min-width: 160px;
    }
    .kpi b { display: block; font-size: 26px; color: var(--accent); }
    .kpi span { color: var(--muted); font-size: 12px; }
    .flow {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      background: #0a101c;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      color: #b8f0e8;
      white-space: pre;
      overflow: auto;
    }
    .hero {
      padding: 40px 8px 10px;
    }
    .hero h2 { font-size: 40px; max-width: 760px; }
    a { color: var(--accent-2); }
    code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: #0a101c; padding: 1px 6px; border-radius: 5px; }
    .note { font-size: 12px; color: var(--muted); margin-top: 14px; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
      .g2, .g3 { grid-template-columns: 1fr; }
      .stage { padding: 20px 16px 40px; }
    }
    @media print {
      body { overflow: auto; background: #fff; color: #111; }
      aside, .bar, .progress { display: none !important; }
      .app { display: block; }
      .slide { display: block !important; page-break-after: always; color: #111; }
      .card, table, .kpi { background: #fff; border-color: #ccc; }
      .card p, .card li, td { color: #222; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <h1>ForçaNova</h1>
        <p>Análise técnica RTC · IBS / CBS / IS · NF-e</p>
      </div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <div class="bar">
        <div class="meta" id="meta">1 / —</div>
        <div class="controls">
          <span class="kbd">← →</span>
          <button type="button" id="prev">Anterior</button>
          <button type="button" id="next">Próximo</button>
        </div>
      </div>
      <div class="progress"><span id="prog"></span></div>
      <div class="stage" id="stage"></div>
    </main>
  </div>

  <script>
    const slides = [
      {
        t: "Capa",
        html: `
          <div class="hero">
            <p class="lede" style="text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-size:12px;font-weight:700;">Diagnóstico técnico · sem implementação</p>
            <h2>Reforma Tributária do Consumo no ForçaNova</h2>
            <p class="lede">IBS, CBS e Imposto Seletivo na NF-e/NFC-e. Análise do código Delphi, procedure <code>spRecalcImpostoNota</code>, banco BDNFe, ACBr local e Notas Técnicas oficiais.</p>
            <div class="sum">
              <div class="kpi"><b>65 h</b><span>Esforço total estimado (desenvolvedor)</span></div>
              <div class="kpi"><b>8–9</b><span>Dias úteis (1 pessoa)</span></div>
              <div class="kpi"><b>D</b><span>Arquitetura: banco + Delphi + ACBr já existente</span></div>
            </div>
            <div class="grid g2">
              <div class="card"><h3>Escopo</h3><p>Adequar o destaque fiscal da Reforma Tributária no fluxo atual de NF-e, sem duplicar regra no Delphi e sem atualizar o ACBr na primeira fase.</p></div>
              <div class="card"><h3>Premissa</h3><p>O XML já é gerado. O problema é classificação hardcoded (<code>CST 000</code> / <code>cClassTrib 000001</code>) e cálculo genérico no SQL.</p></div>
            </div>
          </div>`
      },
      {
        t: "Resumo executivo",
        html: `
          <h2>Resumo executivo</h2>
          <p class="lede">Três camadas já existem. Falta a regra fiscal verdadeira, persistida e transportada — não um motor novo.</p>
          <div class="grid g3">
            <div class="card"><h3>Banco</h3><p>A <code>spRecalcImpostoNota</code> calcula IBS/CBS com alíquotas fixas 0,9% (CBS) e 0,1% (IBS UF) sobre <code>I_VPROD</code> e grava <code>NOTA_IMP_REFORMA_NFE</code> / <code>NOTA_NFE_REFORMA</code>.</p></div>
            <div class="card"><h3>Delphi</h3><p><code>PainelE\\uFrmPrincipal.pas</code> lê essas tabelas e preenche o ACBr. Flag <code>bReformaTributaria := True</code>. CST e cClassTrib estão fixos no código.</p></div>
            <div class="card"><h3>ACBr</h3><p>Cópia em <code>C:\\Desenv\\Comp10\\ACBr</code> já serializa Grupo UB. Não é pré-requisito atualizar o componente na fase 1.</p></div>
          </div>
          <p class="note">FATO = confirmado em código/banco/NT. HIPÓTESE = precisa validar em homologação. RECOMENDAÇÃO = proposta arquitetural.</p>`
      },
      {
        t: "Conclusão-chave",
        html: `
          <h2>Por que “não destacavam” — e o que destaca hoje</h2>
          <p class="lede">O destaque no XML já ocorre quando a procedure rodou e o PainelE emite. O que não ocorre é o destaque conforme a legislação.</p>
          <table>
            <thead><tr><th>Pergunta</th><th>Resposta</th><th>Tipo</th></tr></thead>
            <tbody>
              <tr><td>O ACBr local tem IBS/CBS?</td><td>Sim. Classes TIBSCBS / TIBSCBSTot e Gerar_IBSCBS.</td><td><span class="tag fato">FATO</span></td></tr>
              <tr><td>O ForçaNova preenche o XML?</td><td>Sim, em PainelE, a partir das tabelas *_REFORMA_*.</td><td><span class="tag fato">FATO</span></td></tr>
              <tr><td>O cálculo está no banco?</td><td>Sim, único motor de valores. Delphi não recalcula alíquota.</td><td><span class="tag fato">FATO</span></td></tr>
              <tr><td>A classificação está correta?</td><td>Não. Sempre cst000 e 000001 para todos os itens.</td><td><span class="tag fato">FATO</span></td></tr>
              <tr><td>IS está no XML?</td><td>Código comentado. Adequado para 2026, salvo NCM seletivo.</td><td><span class="tag fato">FATO</span></td></tr>
              <tr><td>Atualizar ACBr agora?</td><td>Não, salvo rejeição de schema na homologação.</td><td><span class="tag rec">REC.</span></td></tr>
            </tbody>
          </table>`
      },
      {
        t: "O que mudou",
        html: `
          <h2>O que mudou com IBS, CBS e IS</h2>
          <p class="lede">EC 132/2023 e LC 214/2025. A NT 2025.002-RTC altera o leiaute da NF-e/NFC-e. Não é “só duas alíquotas”.</p>
          <table>
            <thead><tr><th>Tributo</th><th>Natureza</th><th>Substituição</th><th>2026</th></tr></thead>
            <tbody>
              <tr><td>CBS</td><td>Federal</td><td>PIS / COFINS (plena em 2027)</td><td>Alíquota-teste 0,9%</td></tr>
              <tr><td>IBS</td><td>Estadual + municipal</td><td>ICMS / ISS (2029–2033)</td><td>Alíquota-teste 0,1%</td></tr>
              <tr><td>IS</td><td>Seletivo federal</td><td>Bens/serviços definidos em lei</td><td>Pleno em 2027; omitir no XML em 2026</td></tr>
            </tbody>
          </table>
          <div class="grid g2" style="margin-top:14px">
            <div class="card"><h3>Grupo UB (item)</h3><p>IBSCBS com CST (3 dígitos), cClassTrib (6 dígitos), gIBSCBS (vBC, gIBSUF, gIBSMun, gCBS, vIBS). Condicionados: mono, crédito, ZFM, regular.</p></div>
            <div class="card"><h3>Grupo W03 (totais)</h3><p>IBSCBSTot, gIBS, gCBS, vBCIBSCBS. ISTot se houver IS. vNFTot com regra específica de transição.</p></div>
          </div>`
      },
      {
        t: "Vigência 2026",
        html: `
          <h2>Vigência e transição</h2>
          <p class="lede">Produção: valor jurídico a partir de 01/01/2026. RV de obrigatoriedade do grupo (UB12-10) em 03/08/2026, conforme NT 2025.002-RTC v1.51.</p>
          <table>
            <thead><tr><th>Marco</th><th>Homologação</th><th>Produção</th></tr></thead>
            <tbody>
              <tr><td>Out/2025</td><td>Facultativo; se preencher, valida</td><td>Facultativo; sem valor jurídico</td></tr>
              <tr><td>Jan/2026</td><td>Facultativo se preenchido</td><td>Lei já exige informar; RV ainda não rejeita ausência; com valor jurídico</td></tr>
              <tr><td>01/07/2026</td><td>Obrigatório no autorizador</td><td>Ainda sem RV de obrigatoriedade no texto da tabela</td></tr>
              <tr><td>03/08/2026</td><td>Obrigatório</td><td>Obrigatório (RV UB12-10)</td></tr>
              <tr><td>2027+</td><td>SN/MEI/mono em NT futura; IS pleno</td><td>CBS substitui PIS/COFINS</td></tr>
            </tbody>
          </table>
          <p class="note">Simples Nacional / MEI: tributação IBS/CBS a partir de 2027 (art. 348 LC 214). CRT já existe em EMISSOR_ADICIONAL.</p>`
      },
      {
        t: "Documentação oficial",
        html: `
          <h2>Documentação oficial encontrada</h2>
          <table>
            <thead><tr><th>Documento</th><th>Órgão</th><th>Assunto</th><th>Link</th></tr></thead>
            <tbody>
              <tr><td>NT 2025.002-RTC v1.51</td><td>ENCAT / RFB / Portal NF-e</td><td>Layout IBS/CBS/IS, RV, cronograma</td><td><a href="https://www.nfe.fazenda.gov.br/portal/principal.aspx" target="_blank">Portal NF-e</a></td></tr>
              <tr><td>Informe Técnico 2025.002 RTC</td><td>Portal NF-e</td><td>Tabela cClassTrib</td><td>Documentos → Diversos</td></tr>
              <tr><td>LC 214/2025</td><td>Planalto</td><td>Institui IBS, CBS e IS</td><td><a href="https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp214.htm" target="_blank">planalto.gov.br</a></td></tr>
              <tr><td>EC 132/2023</td><td>Planalto</td><td>Reforma do consumo</td><td><a href="https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc132.htm" target="_blank">planalto.gov.br</a></td></tr>
              <tr><td>Entenda a RTC</td><td>Receita Federal</td><td>Transição 2026–2033</td><td><a href="https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/acoes-e-programas/programas-e-atividades/reforma-tributaria-do-consumo/entenda" target="_blank">gov.br/receitafederal</a></td></tr>
              <tr><td>Preenchimento ACBrNFe</td><td>Projeto ACBr</td><td>Como preencher IBS/CBS/IS</td><td><a href="https://www.projetoacbr.com.br/forum/topic/84094-como-preencher-as-informa%C3%A7%C3%B5es-de-ibs-cbs-e-is-para-reforma-tribut%C3%A1ria-no-componente-acbrnfe/" target="_blank">fórum ACBr</a></td></tr>
              <tr><td>Modelo INI Reforma</td><td>ACBr Monitor</td><td>Mapa INI → XML</td><td><a href="https://acbr.sourceforge.io/ACBrMonitor/ModeloNFeINICompletoReformaTribu.html" target="_blank">sourceforge.io</a></td></tr>
            </tbody>
          </table>`
      },
      {
        t: "ACBr local",
        html: `
          <h2>O que o ACBr local já suporta</h2>
          <p class="lede">Pasta <code>C:\\Desenv\\Comp10\\ACBr</code>. Demo: <code>Exemplos\\ACBrDFe\\ACBrNFe\\Delphi</code>.</p>
          <table>
            <thead><tr><th>Recurso</th><th>Unidade</th><th>Uso</th></tr></thead>
            <tbody>
              <tr><td>Enum TCSTIBSCBS</td><td>ACBrDFe.Conversao.pas</td><td>000, 010, 200, 410, 510, 620, 800…</td></tr>
              <tr><td>TIBSCBS / TImposto.IBSCBS / ISel</td><td>ACBrNFe.Classes.pas</td><td>Propriedades do item</td></tr>
              <tr><td>Gerar_IBSCBS / Gerar_IBSCBSTot</td><td>ACBrNFe.XmlWriter.pas</td><td>Serialização XML</td></tr>
              <tr><td>Calculadora cClassTrib</td><td>ACBrCalculadoraConsumo.pas</td><td>Não usado pelo ForçaNova</td></tr>
            </tbody>
          </table>
          <div class="card" style="margin-top:14px"><h3>Regra do writer</h3><p>O grupo <code>IBSCBS</code> só sai no XML se <code>CST &lt;&gt; cstNenhum</code> e <code>cClassTrib &lt;&gt; ''</code>. Para cst000/200/220/510 gera <code>gIBSCBS</code>. <code>gDif</code> só se <code>pDif &gt; 0</code>. <code>gTribCompraGov</code> só se ente e operação governamental preenchidos.</p></div>`
      },
      {
        t: "ForçaNova hoje",
        html: `
          <h2>O que o ForçaNova já possui</h2>
          <table>
            <thead><tr><th>Peça</th><th>Arquivo / objeto</th><th>Situação</th></tr></thead>
            <tbody>
              <tr><td>Recálculo</td><td>spRecalcImpostoNota</td><td>IBS/CBS simplificado + ICMS/PIS/COFINS totais + IBPT</td></tr>
              <tr><td>Chamada</td><td>Administrador\\uFrmNota.pas</td><td>Ao salvar a nota</td></tr>
              <tr><td>Item reforma</td><td>NOTA_IMP_REFORMA_NFE</td><td>BC, alíquotas, valores — sem CST/cClassTrib</td></tr>
              <tr><td>Total reforma</td><td>NOTA_NFE_REFORMA</td><td>W_VL_IBS*, W_VL_CBS</td></tr>
              <tr><td>XML</td><td>PainelE\\uFrmPrincipal.pas</td><td>Mapeamento ACBr ativo</td></tr>
              <tr><td>Datasets</td><td>PainelE\\udmPrincipal</td><td>cdsNotaReforma, cdsProdImpIBSCBS</td></tr>
              <tr><td>CRT</td><td>EMISSOR_ADICIONAL.CRT</td><td>Já vai para NFe.Emit.CRT</td></tr>
              <tr><td>Produto</td><td>NIBS, NCBS, NIS</td><td>Quase vazios; procedure não lê</td></tr>
            </tbody>
          </table>`
      },
      {
        t: "spRecalcImpostoNota",
        html: `
          <h2>Análise da spRecalcImpostoNota</h2>
          <p class="lede">Parâmetros: <code>@CNPJ_EMISSOR</code>, <code>@NUM_SEQ_NFE</code>. Não calcula ICMS item a item: soma o que já está gravado e depois aplica o bloco RTC de 11/11/2025.</p>
          <div class="grid g2">
            <div class="card"><h3>Consulta</h3><p>NOTA_ICMS_NFE, NOTA_ITEM_NFE, NOTA_NFE, TabIBPT, TAB_NCM_MUDAR.</p></div>
            <div class="card"><h3>Altera</h3><p>CST ICMS por CFOP, totais W_*, frete, GTIN, inf. complementar IBPT, MERGE nas tabelas reforma, spEncontraVendedor, spAjustaDuplicata.</p></div>
            <div class="card"><h3>IBS/CBS</h3><p>BC = I_VPROD. CBS 0,9%. IBS UF 0,1%. IBS Mun 0. W_VL_IBS_CBS acumula bases, não IBS+CBS.</p></div>
            <div class="card"><h3>Bug</h3><p>Municipal usa <code>vBC * aliq</code> sem /100 (CBS e IBS UF dividem). Hoje aliq mun = 0, efeito nulo.</p></div>
          </div>`
      },
      {
        t: "Modelo de dados",
        html: `
          <h2>Banco BDNFe — o que reutilizar</h2>
          <p class="lede">Não criar segundo motor de imposto. Ampliar o que já existe. STTRIBUTARIA é CST ICMS de 2 dígitos e não serve para CST IBS de 3 dígitos.</p>
          <table>
            <thead><tr><th>Objeto</th><th>Ação</th></tr></thead>
            <tbody>
              <tr><td>NOTA_IMP_REFORMA_NFE</td><td>Alterar: CST_IBS, C_CLASS_TRIB (e opcional IS)</td></tr>
              <tr><td>NOTA_NFE_REFORMA</td><td>Manter totais; eventualmente alinhar nomes ao XML</td></tr>
              <tr><td>Nova tabela domínio cClassTrib</td><td>Espelho da planilha oficial (código, CST, indicadores, vigência)</td></tr>
              <tr><td>PRODUTO</td><td>Vínculo cClassTrib; não reusar NIBS/NCBS sem definir significado</td></tr>
              <tr><td>CONFIG_NFE / parâmetro data</td><td>Flag emitir grupo UB e alíquotas por ano</td></tr>
              <tr><td>EMISSOR_ADICIONAL.CRT</td><td>Reutilizar</td></tr>
            </tbody>
          </table>`
      },
      {
        t: "Fluxos",
        html: `
          <h2>Fluxo atual × fluxo necessário</h2>
          <div class="grid g2">
            <div>
              <h3 style="margin-bottom:8px;color:var(--muted);font-size:13px;">HOJE</h3>
              <div class="flow">Produto / CST ICMS
   → NOTA_ITEM + NOTA_ICMS
   → spRecalcImpostoNota
      (alíquotas mágicas 0,9 / 0,1)
   → tabelas *_REFORMA_*

    const nav = document.getElementById("nav");

    const meta = document.getElementById("meta");
    const prog = document.getElementById("prog");
    let i = 0;

    slides.forEach((s, idx) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = (idx + 1) + ". " + s.t;
      b.onclick = () => go(idx);
      nav.appendChild(b);
      const d = document.createElement("section");
      d.className = "slide";
      d.innerHTML = s.html;
      stage.appendChild(d);
    });

    function go(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      document.querySelectorAll(".slide").forEach((el, k) => el.classList.toggle("on", k === i));
      document.querySelectorAll("nav button").forEach((el, k) => el.classList.toggle("active", k === i));
      meta.textContent = (i + 1) + " / " + slides.length + "  ·  " + slides[i].t;
      prog.style.width = ((i + 1) / slides.length * 100) + "%";
      document.querySelectorAll("nav button")[i].scrollIntoView({ block: "nearest" });
      stage.scrollTop = 0;
    }

    document.getElementById("prev").onclick = () => go(i - 1);
    document.getElementById("next").onclick = () => go(i + 1);
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") go(i + 1);
      if (e.key === "ArrowLeft" || e.key === "PageUp") go(i - 1);
      if (e.key === "Home") go(0);
      if (e.key === "End") go(slides.length - 1);
    });
    go(0);
  </script>
